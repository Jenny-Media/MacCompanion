name: Public CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-kernel:
    name: Trust kernel (unsigned)
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation tools
        run: brew install xcodegen ripgrep
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcodebuild -version | rg --fixed-strings --line-regexp 'Build version 27A266a'
          xcrun swift --version
          xcodegen --version
          rg --version
      - name: Validate specifications and package
        run: bash scripts/validate.sh
