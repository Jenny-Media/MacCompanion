name: Public CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trust-kernel:
    name: Trust kernel (unsigned)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Validate specifications and package
        run: bash scripts/validate.sh
