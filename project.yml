name: MacCompanion

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  groupSortPosition: top
  minimumXcodeGenVersion: 2.46.0

packages:
  MacCompanionKit:
    path: Packages/MacCompanionKit

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: "6.0"

targets:
  MacCompanion:
    type: application
    platform: macOS
    sources:
      - path: Apps/MacCompanionMac
        excludes:
          - LaunchAgents
      - path: Apps/MacCompanionMac/LaunchAgents/media.jenny.maccompanion.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      - path: spec/privacy-manifest/v0/targets/mac-containing-app/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - target: MacCompanionAgent
        embed: true
        link: false
        codeSign: true
        copy:
          destination: executables
      - package: MacCompanionKit
        product: CompanionAgent
      - package: MacCompanionKit
        product: CompanionAgentPlatform
      - package: MacCompanionKit
        product: CompanionLocalXPCPlatform
      - package: MacCompanionKit
        product: CompanionMacApp
      - package: MacCompanionKit
        product: CompanionMacApplicationPlatform
      - package: MacCompanionKit
        product: CompanionMacUI
    settings:
      base:
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Mac Companion
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: Copyright 2026 Jenny Media LLC
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.maccompanion
        PRODUCT_NAME: Mac Companion

  MacCompanionAgent:
    type: tool
    platform: macOS
    sources:
      - path: Apps/MacCompanionAgent
    dependencies:
      - package: MacCompanionKit
        product: CompanionAgentApplicationPlatform
    settings:
      base:
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_APP_SANDBOX: NO
        OTHER_CODE_SIGN_FLAGS: "-i $(PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.maccompanion.agent
        PRODUCT_NAME: MacCompanionAgent
        SKIP_INSTALL: YES

  MacCompanionIOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/MacCompanionIOS
      - path: spec/privacy-manifest/v0/targets/ios-app/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MacCompanionKit
        product: CompanionClientPlatform
    settings:
      base:
        CODE_SIGN_IDENTITY: ""
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Apps/MacCompanionIOS/Info.plist
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        MARKETING_VERSION: 0.1.0
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.maccompanion.ios
        PRODUCT_NAME: Mac Companion
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  MacCompanion:
    build:
      targets:
        MacCompanion: all
    run:
      config: Debug
    archive:
      config: Release
  MacCompanionIOS:
    build:
      targets:
        MacCompanionIOS: all
    run:
      config: Debug
    archive:
      config: Release
